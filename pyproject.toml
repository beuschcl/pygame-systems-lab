[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pygame-systems-lab"
version = "0.1.0"
description = "Beginner-friendly Pygame learning project."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.13"
packages = ["pygame_systems_lab"]
